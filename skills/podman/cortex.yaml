      type: runbook
      url: https://github.com/AGenNext/Agent-Tools/blob/main/skills/podman/SKILL.md
    - name: Changelog (v5.8.2)
      type: documentation
      url: https://github.com/containers/podman/releases/tag/v5.8.2
  x-cortex-custom-metadata:
    conductor-task: podman
    binary: podman
    category: container-runtime
    publisher: containers (Red Hat)
    verified-by: GitHub (platform owner — signed tags / verified releases / provenance)
    version: v5.8.2
    changelog: https://github.com/containers/podman/releases/tag/v5.8.2
    certification: >-
      Version and capabilities are as claimed by the publisher (see changelog).
      Verifying those claims is, everywhere, the platform owner's responsibility
