name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test & validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go build / vet / test
        run: |
          go version
          go build ./...
          go vet ./...
          go test ./...   # enforces registry invariants (no-blocker rule, etc.)

      - name: Registry validation (taxonomy + rules)
        run: |
          python3 -m pip install --user pyyaml
          python3 scripts/validate_registry.py
