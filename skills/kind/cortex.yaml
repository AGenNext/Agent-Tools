# Tool-Card: registers the `kind` agent tool in the Cortex catalog (the
# tool-registry) via GitOps. Discovered automatically by Cortex.
# NOTE: the custom entity type `agent-tool` must exist in Cortex
# (Settings -> Entity Types) before the first GitOps sync.
openapi: 3.0.1
info:
  title: kind
  x-cortex-tag: tool-kind
  description: >-
    Kubernetes IN Docker — disposable clusters running inside Docker/Podman
    containers. Exposed as the Conductor task `kind`; runs the kind CLI with an
    `args` array and returns stdout/stderr/exitCode.
  x-cortex-type: agent-tool
  x-cortex-groups:
    - agent-tools
    - kubernetes
  x-cortex-owners:
    - type: group
      name: agent-tools-team
      provider: CORTEX
  x-cortex-git:
    github:
      repository: AGenNext/Agent-Tools
      basepath: skills/kind
  x-cortex-link:
    - name: Skill / Runbook
      type: runbook
      url: https://github.com/AGenNext/Agent-Tools/blob/main/skills/kind/SKILL.md
  x-cortex-custom-metadata:
    conductor-task: kind
    binary: kind
    category: kubernetes
    version: 1.0.0
    capabilities: cluster-create, cluster-delete, load-image, multi-node, export-kubeconfig
    input-schema: '{ "args": [string], "timeoutSeconds": number?, "stdin": string? }'
